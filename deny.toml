# cargo deny check (gate: check:deps). Flick links no network code (HTTP goes through a
# /usr/bin/curl child); this keeps vulnerable, yanked, copyleft and non-crates.io
# dependencies out.

[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
