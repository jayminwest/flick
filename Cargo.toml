[package]
name = "flick"
version = "0.0.1"
edition = "2024"
license = "MIT-0"

[dependencies]
block2 = "0.6"
dirs = "7.0.0"
global-hotkey = "0.7"
nucleo-matcher = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["objc2-quartz-core"] }
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "UNUserNotificationCenter"] }
regex-lite = "0.1.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.8"
toml_edit = { version = "0.25.15", default-features = false, features = ["parse", "display"] }

# Size, not speed: check:binary-size caps target/release/flick. Do not set
# panic = "abort": core/registry.rs and platform/{events,keytap} catch module
# and FFI-callback panics with catch_unwind.
[profile.release]
strip = true
lto = "fat"
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# FFI-noisy pedantic lints: AppKit/CG/AX calls take raw pointers and C numeric
# types, so these fire on correct code at every call site.
borrow_as_ptr = "allow"
ref_as_ptr = "allow"
ptr_as_ptr = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Binary crate: no public API to document or annotate.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Restriction lints opted into on top of pedantic.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
allow_attributes_without_reason = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"

[package.metadata.cargo-machete]
# Linked only to turn on its default features (CALayer methods used through
# `NSView::layer()` in src/platform/panel/mod.rs); no `use` path names it.
ignored = ["objc2-quartz-core"]
