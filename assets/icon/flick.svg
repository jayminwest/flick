<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Flick app icon ("Ghost"): macOS grid, 824 px rounded square inset 100 px -->
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e222c"/>
      <stop offset="1" stop-color="#101217"/>
    </linearGradient>
  </defs>
  <g transform="translate(100 100) scale(8.24)">
    <rect width="100" height="100" rx="22.5" fill="url(#ink)"/>
    <circle cx="40" cy="60" r="12" fill="#ffb347" fill-opacity=".24"/>
    <circle cx="50" cy="50" r="12" fill="#ffb347" fill-opacity=".5"/>
    <circle cx="60" cy="40" r="12" fill="#ffb347"/>
  </g>
</svg>
